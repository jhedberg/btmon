[workspace]
resolver = "2"
members = [
    "crates/hcimon-capture",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Johan Hedberg <johan.hedberg@gmail.com>"]

[workspace.dependencies]
hcimon-capture = { path = "crates/hcimon-capture", version = "0.2.0" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
ctrlc = { version = "3.4", features = ["termination"] }
jiff = "0.2"
libc = "0.2"
probe-rs = "0.32"
ratatui = "0.30"
serialport = "4.10"
thiserror = "2.0"

[profile.release]
debug = 1
lto = "thin"

# probe-rs and its dependencies are large; keep debug builds tolerable.
[profile.dev.package."*"]
opt-level = 1
